[workspace]
resolver = "2"
members = ["contracts/*"]

# This workspace is intentionally separate from `onchain/` so extension
# contracts can evolve without touching the core StellarHunts contracts.
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["StellarHunts Team"]
license = "MIT"
publish = false

[workspace.dependencies]
soroban-sdk = { version = "28.0.0" }

[profile.release]
opt-level = "z"
overflow-checks = true
debug-assertions = false
strip = "symbols"
panic = "abort"
codegen-units = 1
lto = true

[profile.test]
opt-level = 0
debug = true
